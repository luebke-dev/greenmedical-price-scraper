[package]
name = "greenmedical-backend"
version = "0.1.0"
edition = "2024"
rust-version = "1.98"
description = "GreenMedical price scraper backend: in-process scheduler, HTML scraper, PostgreSQL storage and JSON API"
license = "MIT"
publish = false

[[bin]]
name = "greenmedical-backend"
path = "src/main.rs"

[lib]
name = "greenmedical_backend"
path = "src/lib.rs"

[dependencies]
anyhow = "1"
arc-swap = "1.9"
axum = { version = "0.8.9", features = ["macros"] }
base64 = "0.22"
chrono = { version = "0.4", features = ["serde"] }
chrono-tz = "0.10.4"
clap = { version = "4.6.1", features = ["derive", "env"] }
constant_time_eq = "0.5"
cron = "0.17"
csv = "1.4"
humantime = "2.4"
lettre = { version = "0.11", default-features = false, features = ["smtp-transport", "builder", "hostname", "tokio1", "tokio1-rustls-tls"] }
metrics = "0.24.6"
metrics-exporter-prometheus = { version = "0.18.3", default-features = false }
rand = "0.9"
regex = "1"
reqwest = { version = "0.13.4", default-features = false, features = ["rustls", "gzip", "http2", "charset", "cookies"] }
scraper = "0.27"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
sqlx = { version = "0.9.0", default-features = false, features = ["runtime-tokio", "tls-rustls", "postgres", "macros", "migrate", "chrono"] }
thiserror = "2"
tokio = { version = "1.53", features = ["rt-multi-thread", "macros", "signal", "time", "sync", "net"] }
tokio-util = { version = "0.7", features = ["rt"] }
tower = { version = "0.5", features = ["util"] }
tower-http = { version = "0.7.0", features = ["trace", "compression-gzip", "cors", "request-id", "util", "set-header"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json", "fmt"] }
unicode-normalization = "0.1"
url = "2.5"
utoipa = { version = "5", features = ["axum_extras", "chrono", "url"] }
utoipa-swagger-ui = { version = "9", default-features = false, features = ["axum", "vendored"] }

[dev-dependencies]
http-body-util = "0.1"
pretty_assertions = "1.4"
rstest = "0.26"
wiremock = "0.6.5"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
