<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>GreenMedical Livebestand</title>
  <style>
    :root {
      color-scheme: light dark;
      --bg: #eef1ec;
      --bg-glow: radial-gradient(1200px 600px at 80% -10%, rgba(47, 143, 107, 0.10), transparent 60%);
      --surface: #ffffff;
      --surface-soft: #f7faf6;
      --surface-2: #eef3ed;
      --text: #14201b;
      --muted: #5a6a61;
      --line: #e3e8df;
      --line-strong: #d2dacb;
      --accent: #2f8f6b;
      --accent-strong: #1f6e51;
      --accent-soft: #e6f3ec;
      --amber: #a06a16;
      --amber-soft: #fbeecd;
      --shadow: 0 8px 24px rgba(20, 40, 30, 0.07);
      --shadow-lg: 0 18px 44px rgba(20, 40, 30, 0.12);
      --radius: 14px;
      --radius-sm: 10px;
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #0d1310;
        --bg-glow: radial-gradient(1200px 600px at 80% -10%, rgba(76, 201, 153, 0.12), transparent 60%);
        --surface: #141c18;
        --surface-soft: #19221d;
        --surface-2: #1e2823;
        --text: #e9efe9;
        --muted: #9aa9a0;
        --line: #25302a;
        --line-strong: #344038;
        --accent: #4cc999;
        --accent-strong: #74dcb2;
        --accent-soft: #16271f;
        --amber: #e7b15a;
        --amber-soft: #2a2113;
        --shadow: 0 8px 24px rgba(0, 0, 0, 0.45);
        --shadow-lg: 0 18px 44px rgba(0, 0, 0, 0.55);
      }
    }

    * {
      box-sizing: border-box;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background: var(--bg-glow), var(--bg);
      background-attachment: fixed;
      color: var(--text);
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      font-size: 16px;
      line-height: 1.5;
      -webkit-font-smoothing: antialiased;
      text-rendering: optimizeLegibility;
    }

    a {
      color: var(--accent-strong);
      text-decoration-thickness: 1px;
      text-underline-offset: 3px;
    }

    :focus-visible {
      outline: 2px solid var(--accent);
      outline-offset: 2px;
      border-radius: 6px;
    }

    .page {
      width: min(1440px, calc(100% - 32px));
      margin: 0 auto;
      padding: 36px 0 48px;
    }

    header {
      display: grid;
      gap: 22px;
      margin-bottom: 24px;
    }

    .title-row {
      display: flex;
      align-items: end;
      justify-content: space-between;
      gap: 18px;
      flex-wrap: wrap;
    }

    .brand {
      display: inline-flex;
      align-items: center;
      gap: 12px;
    }

    .brand-dot {
      width: 14px;
      height: 14px;
      border-radius: 50%;
      background: linear-gradient(150deg, var(--accent), var(--accent-strong));
      box-shadow: 0 0 0 4px var(--accent-soft);
      flex: none;
    }

    h1 {
      margin: 0;
      font-size: clamp(1.8rem, 2.8vw, 3rem);
      line-height: 1.04;
      font-weight: 780;
      letter-spacing: -0.02em;
    }

    .updated {
      margin-top: 6px;
      color: var(--muted);
      font-size: 0.95rem;
    }

    .links {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
    }

    .links a,
    .clear-button {
      display: inline-flex;
      min-height: 40px;
      align-items: center;
      justify-content: center;
      gap: 6px;
      border: 1px solid var(--line-strong);
      border-radius: var(--radius-sm);
      background: var(--surface);
      color: var(--text);
      padding: 0 14px;
      font: inherit;
      font-size: 0.92rem;
      font-weight: 600;
      text-decoration: none;
      cursor: pointer;
      transition: border-color 0.15s ease, background 0.15s ease, transform 0.05s ease;
    }

    .links a:hover,
    .clear-button:hover {
      border-color: var(--accent);
      background: var(--accent-soft);
    }

    .links a:active,
    .clear-button:active {
      transform: translateY(1px);
    }

    .metrics {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 14px;
    }

    .metric {
      position: relative;
      min-height: 92px;
      border: 1px solid var(--line);
      border-radius: var(--radius);
      background: var(--surface);
      padding: 16px 18px;
      box-shadow: var(--shadow);
      overflow: hidden;
      transition: transform 0.15s ease, box-shadow 0.15s ease;
    }

    .metric::before {
      content: "";
      position: absolute;
      inset: 0 auto 0 0;
      width: 3px;
      background: linear-gradient(var(--accent), var(--accent-strong));
    }

    .metric:hover {
      transform: translateY(-2px);
      box-shadow: var(--shadow-lg);
    }

    .metric-label {
      color: var(--muted);
      font-size: 0.74rem;
      font-weight: 700;
      letter-spacing: 0.04em;
      text-transform: uppercase;
    }

    .metric-value {
      margin-top: 8px;
      font-size: 1.55rem;
      font-weight: 780;
      line-height: 1.1;
      letter-spacing: -0.01em;
      font-variant-numeric: tabular-nums;
    }

    .toolbar {
      display: grid;
      grid-template-columns: minmax(220px, 1fr) auto;
      gap: 12px;
      align-items: center;
      margin: 24px 0 14px;
    }

    .search {
      width: 100%;
      min-height: 48px;
      border: 1px solid var(--line-strong);
      border-radius: var(--radius-sm);
      background: var(--surface);
      color: var(--text);
      padding: 0 16px;
      font: inherit;
      outline: none;
      transition: border-color 0.15s ease, box-shadow 0.15s ease;
    }

    .search::placeholder {
      color: var(--muted);
    }

    .search:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 4px var(--accent-soft);
    }

    .result-count {
      color: var(--muted);
      font-size: 0.94rem;
      font-weight: 600;
      white-space: nowrap;
    }

    .table-wrap {
      overflow: auto;
      border: 1px solid var(--line);
      border-radius: var(--radius);
      background: var(--surface);
      box-shadow: var(--shadow);
    }

    table {
      width: 100%;
      min-width: 1040px;
      border-collapse: collapse;
      table-layout: fixed;
    }

    thead {
      position: sticky;
      top: 0;
      z-index: 2;
      background: color-mix(in srgb, var(--surface) 88%, transparent);
      backdrop-filter: blur(8px);
    }

    th,
    td {
      border-bottom: 1px solid var(--line);
      padding: 13px 16px;
      text-align: left;
      vertical-align: middle;
    }

    th {
      color: var(--muted);
      font-size: 0.74rem;
      font-weight: 760;
      text-transform: uppercase;
      letter-spacing: 0.04em;
      white-space: nowrap;
    }

    th button {
      display: inline-flex;
      width: 100%;
      min-height: 28px;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      border: 0;
      background: transparent;
      color: inherit;
      padding: 0;
      font: inherit;
      text-align: left;
      text-transform: inherit;
      letter-spacing: inherit;
      cursor: pointer;
      transition: color 0.12s ease;
    }

    th button:hover {
      color: var(--accent-strong);
    }

    .sort-indicator {
      color: var(--accent);
      font-size: 0.7rem;
    }

    td {
      color: var(--text);
      font-size: 0.94rem;
      overflow-wrap: anywhere;
      font-variant-numeric: tabular-nums;
    }

    .price {
      color: var(--accent-strong);
      font-weight: 740;
      white-space: nowrap;
    }

    .status {
      display: inline-flex;
      min-height: 24px;
      align-items: center;
      gap: 5px;
      border-radius: 999px;
      background: var(--accent-soft);
      color: var(--accent-strong);
      padding: 3px 10px;
      font-size: 0.8rem;
      font-weight: 700;
      white-space: nowrap;
    }

    .status::before {
      content: "";
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: currentColor;
    }

    .status.new {
      background: var(--amber-soft);
      color: var(--amber);
    }

    .empty {
      padding: 48px 14px;
      color: var(--muted);
      text-align: center;
    }

    .group-row {
      cursor: pointer;
      transition: background 0.12s ease;
    }

    .group-row:hover {
      background: var(--surface-soft);
    }

    .group-row.expanded {
      background: var(--accent-soft);
    }

    .group-row.expanded td {
      border-bottom-color: transparent;
    }

    .strain-name {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      font-weight: 680;
    }

    .chevron {
      color: var(--accent);
      font-size: 0.7rem;
      transition: transform 0.18s ease;
      flex: none;
    }

    .group-row.expanded .chevron {
      transform: rotate(90deg);
    }

    .detail-row > td {
      padding: 0;
      background: var(--surface-2);
    }

    table.offers {
      width: 100%;
      min-width: 0;
      border-collapse: collapse;
      table-layout: auto;
      animation: fade-in 0.18s ease both;
    }

    @keyframes fade-in {
      from { opacity: 0; transform: translateY(-3px); }
      to { opacity: 1; transform: translateY(0); }
    }

    table.offers th,
    table.offers td {
      border-bottom: 1px solid var(--line);
      padding: 11px 16px;
      font-size: 0.9rem;
    }

    table.offers thead th {
      color: var(--muted);
      font-size: 0.7rem;
      font-weight: 700;
      letter-spacing: 0.04em;
      text-transform: uppercase;
      background: transparent;
    }

    table.offers tbody tr {
      transition: background 0.1s ease;
    }

    table.offers tbody tr:hover {
      background: color-mix(in srgb, var(--accent-soft) 60%, transparent);
    }

    table.offers tbody tr:last-child td {
      border-bottom: 0;
    }

    table.offers tbody tr:first-child td {
      border-top: 1px solid var(--line);
    }

    footer {
      margin-top: 18px;
      color: var(--muted);
      font-size: 0.86rem;
    }

    @media (prefers-reduced-motion: reduce) {
      * {
        animation-duration: 0.001ms !important;
        transition-duration: 0.001ms !important;
        scroll-behavior: auto !important;
      }
    }

    @media (max-width: 860px) {
      .page {
        width: min(100% - 20px, 1440px);
        padding-top: 22px;
      }

      .metrics {
        grid-template-columns: repeat(2, minmax(0, 1fr));
      }

      .toolbar {
        grid-template-columns: 1fr;
      }

      .result-count {
        white-space: normal;
      }
    }

    @media (max-width: 560px) {
      .metrics {
        grid-template-columns: 1fr;
      }

      .links {
        width: 100%;
      }

      .links a,
      .clear-button {
        flex: 1 1 120px;
      }
    }

  </style>
</head>
<body>
  <main class="page">
    <header>
      <div class="title-row">
        <div>
          <div class="brand">
            <span class="brand-dot" aria-hidden="true"></span>
            <h1>GreenMedical Livebestand</h1>
          </div>
          <div class="updated">Stand: <span id="updatedAt">__GENERATED_LABEL__</span></div>
        </div>
        <nav class="links" aria-label="Downloads">
          <a href="data/greenmedical_flowers.csv">CSV</a>
          <a href="data/flowers.json">JSON</a>
        </nav>
      </div>

      <section class="metrics" aria-label="Kennzahlen">
        <div class="metric">
          <div class="metric-label">Angebote</div>
          <div class="metric-value" id="totalCount">__TOTAL__</div>
        </div>
        <div class="metric">
          <div class="metric-label">Apotheken</div>
          <div class="metric-value" id="pharmacyCount">__PHARMACIES__</div>
        </div>
        <div class="metric">
          <div class="metric-label">Sorten</div>
          <div class="metric-value" id="strainCount">__STRAINS__</div>
        </div>
        <div class="metric">
          <div class="metric-label">Günstigster Preis</div>
          <div class="metric-value" id="lowestPrice">__LOWEST_PRICE__</div>
        </div>
      </section>
    </header>

    <section class="toolbar" aria-label="Filter">
      <input id="searchInput" class="search" type="search" placeholder="Sorte, Apotheke, Stadt, THC, CBD" autocomplete="off">
      <div class="links">
        <button id="clearSearch" class="clear-button" type="button">Leeren</button>
        <div class="result-count" id="resultCount">0 Sorten</div>
      </div>
    </section>

    <section class="table-wrap" aria-label="Preistabelle">
      <table>
        <thead>
          <tr id="tableHead"></tr>
        </thead>
        <tbody id="tableBody">
          <tr><td class="empty">Daten werden geladen.</td></tr>
        </tbody>
      </table>
    </section>

    <footer>
      Quelle: greenmedical.health. Preise und Verfügbarkeit können sich kurzfristig ändern.
    </footer>
  </main>

  <script>
    const columns = [
      { key: "name", label: "Sorte", type: "text", width: "20%" },
      { key: "bezeichnung", label: "Bezeichnung", type: "text", width: "19%" },
      { key: "price", label: "ab €/g", type: "number", className: "price", width: "11%" },
      { key: "price_per_thc_gram", label: "ab €/g THC", type: "number", className: "price", width: "12%" },
      { key: "thc", label: "THC", type: "number", width: "8%" },
      { key: "cbd", label: "CBD", type: "number", width: "8%" },
      { key: "genetik", label: "Genetik", type: "text", width: "12%" },
      { key: "pharmacy_count", label: "Apotheken", type: "number", width: "10%" }
    ];

    const state = {
      rows: [],
      filtered: [],
      sortKey: "price",
      sortDirection: "asc"
    };

    const elements = {
      head: document.getElementById("tableHead"),
      body: document.getElementById("tableBody"),
      search: document.getElementById("searchInput"),
      clear: document.getElementById("clearSearch"),
      resultCount: document.getElementById("resultCount"),
      updatedAt: document.getElementById("updatedAt"),
      totalCount: document.getElementById("totalCount"),
      pharmacyCount: document.getElementById("pharmacyCount"),
      strainCount: document.getElementById("strainCount"),
      lowestPrice: document.getElementById("lowestPrice")
    };

    const collator = new Intl.Collator("de", { numeric: true, sensitivity: "base" });
    const priceFormatter = new Intl.NumberFormat("de-DE", {
      minimumFractionDigits: 2,
      maximumFractionDigits: 2
    });

    function getSortValue(row, key) {
      if (key === "price") return row.sort.price;
      if (key === "price_per_thc_gram") return row.sort.price_per_thc_gram;
      if (key === "thc") return row.sort.thc;
      if (key === "cbd") return row.sort.cbd;
      if (key === "pharmacy_count") return row.pharmacy_count;
      return row[key] || "";
    }

    function formatPrice(value) {
      if (value === null || Number.isNaN(value)) return "";
      return `${priceFormatter.format(value)} €/g`;
    }

    function formatThcPrice(value) {
      if (value === null || Number.isNaN(value)) return "";
      return `${priceFormatter.format(value)} €/g THC`;
    }

    function updateHeader() {
      elements.head.replaceChildren();

      for (const column of columns) {
        const th = document.createElement("th");
        th.style.width = column.width;
        th.setAttribute(
          "aria-sort",
          state.sortKey === column.key
            ? (state.sortDirection === "asc" ? "ascending" : "descending")
            : "none"
        );

        const button = document.createElement("button");
        button.type = "button";
        button.dataset.key = column.key;

        const label = document.createElement("span");
        label.textContent = column.label;
        button.appendChild(label);

        const indicator = document.createElement("span");
        indicator.className = "sort-indicator";
        indicator.textContent = state.sortKey === column.key
          ? (state.sortDirection === "asc" ? "^" : "v")
          : "";
        button.appendChild(indicator);

        button.addEventListener("click", () => {
          if (state.sortKey === column.key) {
            state.sortDirection = state.sortDirection === "asc" ? "desc" : "asc";
          } else {
            state.sortKey = column.key;
            state.sortDirection = column.type === "number" ? "asc" : "asc";
          }
          applyFilters();
        });

        th.appendChild(button);
        elements.head.appendChild(th);
      }
    }

    function sortRows(rows) {
      const column = columns.find((item) => item.key === state.sortKey);
      const direction = state.sortDirection === "asc" ? 1 : -1;

      rows.sort((left, right) => {
        const leftValue = getSortValue(left, state.sortKey);
        const rightValue = getSortValue(right, state.sortKey);

        if (column && column.type === "number") {
          const leftNumber = leftValue === null ? Number.POSITIVE_INFINITY : leftValue;
          const rightNumber = rightValue === null ? Number.POSITIVE_INFINITY : rightValue;
          return (leftNumber - rightNumber) * direction;
        }

        return collator.compare(String(leftValue), String(rightValue)) * direction;
      });
    }

    function applyFilters() {
      const query = elements.search.value.trim().toLowerCase();
      state.filtered = query
        ? state.rows.filter((row) => row.search.includes(query))
        : [...state.rows];

      sortRows(state.filtered);
      updateHeader();
      renderRows();
      updateResultCount();
    }

    function statusBadge(value) {
      const status = document.createElement("span");
      status.className = value.toLowerCase().includes("neu") ? "status new" : "status";
      status.textContent = value;
      return status;
    }

    function buildOffersTable(strain) {
      const table = document.createElement("table");
      table.className = "offers";

      const thead = document.createElement("thead");
      const headRow = document.createElement("tr");
      for (const label of ["Apotheke", "Stadt", "€/g", "€/g THC", "Status"]) {
        const th = document.createElement("th");
        th.textContent = label;
        headRow.appendChild(th);
      }
      thead.appendChild(headRow);
      table.appendChild(thead);

      const tbody = document.createElement("tbody");
      for (const offer of strain.offers) {
        const row = document.createElement("tr");

        const apotheke = document.createElement("td");
        apotheke.textContent = offer.apotheke || "";
        row.appendChild(apotheke);

        const stadt = document.createElement("td");
        stadt.textContent = offer.apotheke_stadt || "";
        row.appendChild(stadt);

        const price = document.createElement("td");
        price.className = "price";
        price.textContent = offer.preis_pro_gramm || formatPrice(offer.preis_eur_pro_gramm);
        row.appendChild(price);

        const thcPrice = document.createElement("td");
        thcPrice.className = "price";
        thcPrice.textContent = formatThcPrice(offer.preis_eur_pro_gramm_thc);
        row.appendChild(thcPrice);

        const status = document.createElement("td");
        if (offer.verfuegbarkeit) status.appendChild(statusBadge(offer.verfuegbarkeit));
        row.appendChild(status);

        tbody.appendChild(row);
      }
      table.appendChild(tbody);
      return table;
    }

    function renderRows() {
      elements.body.replaceChildren();

      if (state.filtered.length === 0) {
        const row = document.createElement("tr");
        const cell = document.createElement("td");
        cell.className = "empty";
        cell.colSpan = columns.length;
        cell.textContent = "Keine Sorten gefunden.";
        row.appendChild(cell);
        elements.body.appendChild(row);
        return;
      }

      const fragment = document.createDocumentFragment();

      for (const strain of state.filtered) {
        const groupRow = document.createElement("tr");
        groupRow.className = "group-row";

        for (const column of columns) {
          const cell = document.createElement("td");
          if (column.className) cell.className = column.className;

          if (column.key === "name") {
            const wrap = document.createElement("span");
            wrap.className = "strain-name";
            const chevron = document.createElement("span");
            chevron.className = "chevron";
            chevron.textContent = "▸";
            wrap.appendChild(chevron);
            const text = document.createElement("span");
            text.textContent = strain.name || "—";
            wrap.appendChild(text);
            cell.appendChild(wrap);
          } else if (column.key === "price") {
            cell.textContent =
              strain.min_price === null ? "" : `ab ${formatPrice(strain.min_price)}`;
          } else if (column.key === "price_per_thc_gram") {
            cell.textContent =
              strain.min_price_per_thc_gram === null
                ? ""
                : `ab ${formatThcPrice(strain.min_price_per_thc_gram)}`;
          } else if (column.key === "pharmacy_count") {
            cell.textContent = strain.pharmacy_count.toLocaleString("de-DE");
          } else {
            cell.textContent = strain[column.key] || "";
          }

          groupRow.appendChild(cell);
        }

        const detailRow = document.createElement("tr");
        detailRow.className = "detail-row";
        detailRow.hidden = true;
        const detailCell = document.createElement("td");
        detailCell.colSpan = columns.length;
        detailCell.appendChild(buildOffersTable(strain));
        detailRow.appendChild(detailCell);

        groupRow.addEventListener("click", () => {
          const show = detailRow.hidden;
          detailRow.hidden = !show;
          groupRow.classList.toggle("expanded", show);
        });

        fragment.appendChild(groupRow);
        fragment.appendChild(detailRow);
      }

      elements.body.appendChild(fragment);
    }

    function updateResultCount() {
      const count = state.filtered.length;
      elements.resultCount.textContent = `${count.toLocaleString("de-DE")} Sorten`;
    }

    function updateMetrics(metadata) {
      elements.totalCount.textContent = metadata.total.toLocaleString("de-DE");
      elements.pharmacyCount.textContent = metadata.pharmacy_count.toLocaleString("de-DE");
      elements.strainCount.textContent = metadata.strain_count.toLocaleString("de-DE");
      elements.lowestPrice.textContent = formatPrice(metadata.lowest_price);

      const generatedAt = new Date(metadata.generated_at);
      if (!Number.isNaN(generatedAt.valueOf())) {
        elements.updatedAt.textContent = generatedAt.toLocaleString("de-DE", {
          dateStyle: "medium",
          timeStyle: "short"
        });
      }
    }

    async function loadData() {
      const [rowsResponse, metadataResponse] = await Promise.all([
        fetch("data/flowers.json"),
        fetch("data/metadata.json")
      ]);

      if (!rowsResponse.ok || !metadataResponse.ok) {
        throw new Error("Daten konnten nicht geladen werden.");
      }

      state.rows = await rowsResponse.json();
      const metadata = await metadataResponse.json();
      updateMetrics(metadata);
      applyFilters();
    }

    elements.search.addEventListener("input", applyFilters);
    elements.clear.addEventListener("click", () => {
      elements.search.value = "";
      elements.search.focus();
      applyFilters();
    });

    updateHeader();
    loadData().catch((error) => {
      elements.body.replaceChildren();
      const row = document.createElement("tr");
      const cell = document.createElement("td");
      cell.className = "empty";
      cell.colSpan = columns.length;
      cell.textContent = error.message;
      row.appendChild(cell);
      elements.body.appendChild(row);
    });
  </script>
</body>
</html>
