name: Scrape and publish

on:
  workflow_dispatch:
  schedule:
    # GitHub schedules use UTC. These cover 10:00/22:00 in Europe/Berlin
    # across CET and CEST; the gate job below keeps only the matching local hours.
    - cron: "0 8,9,20,21 * * *"
  push:
    branches:
      - main

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  gate:
    runs-on: ubuntu-latest
    outputs:
      should_run: ${{ steps.schedule.outputs.should_run }}

    steps:
      - name: Check schedule
        id: schedule
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" != "schedule" ]]; then
            echo "should_run=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          local_hour="$(TZ=Europe/Berlin date +%H)"
          if [[ "$local_hour" == "10" || "$local_hour" == "22" ]]; then
            echo "should_run=true" >> "$GITHUB_OUTPUT"
          else
            echo "should_run=false" >> "$GITHUB_OUTPUT"
          fi

  build:
    needs: gate
    if: needs.gate.outputs.should_run == 'true'
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install ".[dev]"

      - name: Lint
        run: ruff check .

      - name: Run tests
        run: python -m pytest -q

      - name: Scrape current prices
        run: python -u scraper.py --output greenmedical_flowers.csv

      - name: Build static site
        run: python build_site.py --input greenmedical_flowers.csv --output dist

      - name: Configure Pages
        uses: actions/configure-pages@v6

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
