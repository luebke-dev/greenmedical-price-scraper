name: Scrape and publish

on:
  workflow_dispatch:
  schedule:
    # GitHub schedules use UTC. These cover 10:00/22:00 in Europe/Berlin
    # across CET and CEST; the gate job below keeps only the matching local hours.
    - cron: "0 8,9,20,21 * * *"
  push:
    branches:
      - main

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  gate:
    runs-on: ubuntu-latest
    outputs:
      should_run: ${{ steps.schedule.outputs.should_run }}
      should_scrape: ${{ steps.schedule.outputs.should_scrape }}

    steps:
      # Decide two things:
      #   should_run    - run the build/deploy at all
      #   should_scrape - re-scrape prices (only on schedule/manual; never on a
      #                   plain push, so website changes redeploy without scraping)
      - name: Plan run
        id: schedule
        shell: bash
        run: |
          should_run=true
          should_scrape=false

          case "${{ github.event_name }}" in
            schedule)
              local_hour="$(TZ=Europe/Berlin date +%H)"
              if [[ "$local_hour" == "10" || "$local_hour" == "22" ]]; then
                should_scrape=true
              else
                should_run=false
              fi
              ;;
            workflow_dispatch)
              should_scrape=true
              ;;
            *)
              # push and everything else: rebuild + deploy from committed data
              should_scrape=false
              ;;
          esac

          echo "should_run=$should_run" >> "$GITHUB_OUTPUT"
          echo "should_scrape=$should_scrape" >> "$GITHUB_OUTPUT"

  build:
    needs: gate
    if: needs.gate.outputs.should_run == 'true'
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install ".[dev]"

      - name: Lint
        run: ruff check .

      - name: Run tests
        run: python -m pytest -q

      - name: Decide whether to scrape
        id: plan
        shell: bash
        run: |
          # Scrape on schedule/manual, or to bootstrap when no data exists yet.
          if [[ "${{ needs.gate.outputs.should_scrape }}" == "true" || ! -f data/greenmedical_flowers.csv ]]; then
            echo "scrape=true" >> "$GITHUB_OUTPUT"
          else
            echo "scrape=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Scrape current prices
        if: steps.plan.outputs.scrape == 'true'
        run: python -u scraper.py --output data/greenmedical_flowers.csv

      - name: Commit updated data
        if: steps.plan.outputs.scrape == 'true'
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/greenmedical_flowers.csv
          if git diff --staged --quiet; then
            echo "No data changes to commit."
          else
            git commit -m "Update scraped prices [skip ci]"
            git push origin HEAD:main
          fi

      - name: Build static site
        run: python build_site.py --input data/greenmedical_flowers.csv --output dist

      - name: Configure Pages
        uses: actions/configure-pages@v6

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
