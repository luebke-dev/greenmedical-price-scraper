apiVersion: v2
name: greenmedical
description: >-
  GreenMedical Livebestand – Rust-Backend (Scraper + REST-API) und Quasar-Frontend
  für die Preisübersicht von Cannabisblüten bei GreenMedical-Partnerapotheken.
  Benötigt eine externe PostgreSQL-Datenbank (z. B. CloudNativePG).
type: application
version: 0.1.0
appVersion: "0.1.0"
kubeVersion: ">=1.28.0-0"
home: https://github.com/luebke-dev/greenmedical-price-scraper
icon: https://raw.githubusercontent.com/luebke-dev/greenmedical-price-scraper/main/charts/greenmedical/icon.svg
sources:
  - https://github.com/luebke-dev/greenmedical-price-scraper
keywords:
  - greenmedical
  - cannabis
  - scraper
  - prices
  - rust
  - quasar
maintainers:
  - name: Sebastian Lübke
    url: https://github.com/luebke-dev
annotations:
  artifacthub.io/category: monitoring-logging
  # prerelease + images are rewritten by .github/workflows/release.yml before `helm package`
  # so they always match the released --app-version (semver tag or sha-<short>).
  artifacthub.io/prerelease: "false"
  artifacthub.io/images: |
    - name: backend
      image: ghcr.io/luebke-dev/greenmedical-backend:0.1.0
    - name: frontend
      image: ghcr.io/luebke-dev/greenmedical-frontend:0.1.0
  artifacthub.io/links: |
    - name: Quellcode
      url: https://github.com/luebke-dev/greenmedical-price-scraper
    - name: API-Vertrag
      url: https://github.com/luebke-dev/greenmedical-price-scraper/blob/main/docs/api-contract.md
