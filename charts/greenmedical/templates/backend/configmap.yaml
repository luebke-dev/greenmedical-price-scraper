{{- $cfg := .Values.backend.config -}}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "greenmedical.backend.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "greenmedical.backend.labels" . | nindent 4 }}
  {{- with .Values.commonAnnotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
data:
  # Bind addresses are fixed: the container ports below and the Service target ports rely on them.
  HTTP_BIND: "0.0.0.0:8080"
  METRICS_BIND: "0.0.0.0:9090"
  LOG_FORMAT: {{ $cfg.logFormat | quote }}
  RUST_LOG: {{ $cfg.rustLog | quote }}
  MIGRATE_ON_STARTUP: {{ $cfg.migrateOnStartup | toString | quote }}
  DATABASE_MAX_CONNECTIONS: {{ $cfg.databaseMaxConnections | toString | quote }}
  {{- with $cfg.httpRequestTimeout }}
  HTTP_REQUEST_TIMEOUT: {{ . | quote }}
  {{- end }}
  {{- with $cfg.snapshotRevalidateInterval }}
  SNAPSHOT_REVALIDATE_INTERVAL: {{ . | quote }}
  {{- end }}
  {{- with $cfg.corsAllowedOrigins }}
  CORS_ALLOWED_ORIGINS: {{ . | quote }}
  {{- end }}
  PUBLIC_URL: {{ include "greenmedical.publicUrl" . | quote }}
  {{- with $cfg.subscriptionRateLimit }}
  SUBSCRIPTION_RATE_LIMIT: {{ . | quote }}
  {{- end }}
  EMAIL_ENABLED: {{ .Values.email.enabled | toString | quote }}
  {{- with .Values.email.from }}
  EMAIL_FROM: {{ . | quote }}
  {{- end }}
  {{- if .Values.email.enabled }}
  SMTP_HOST: {{ .Values.email.smtp.host | quote }}
  SMTP_PORT: {{ .Values.email.smtp.port | toString | quote }}
  SMTP_TLS: {{ .Values.email.smtp.tls | quote }}
  {{- end }}
  SCRAPE_ENABLED: {{ $cfg.scrapeEnabled | toString | quote }}
  SCRAPE_CRON: {{ $cfg.scrapeCron | quote }}
  SCRAPE_TIMEZONE: {{ $cfg.scrapeTimezone | quote }}
  SCRAPE_BOOTSTRAP: {{ $cfg.scrapeBootstrap | toString | quote }}
  {{- with $cfg.scrapeBootstrapMaxAge }}
  SCRAPE_BOOTSTRAP_MAX_AGE: {{ . | quote }}
  {{- end }}
  {{- with $cfg.scrapeStaleRunAfter }}
  SCRAPE_STALE_RUN_AFTER: {{ . | quote }}
  {{- end }}
  {{- with $cfg.scrapeBaseUrl }}
  SCRAPE_BASE_URL: {{ . | quote }}
  {{- end }}
  {{- with $cfg.scrapeUserAgent }}
  SCRAPE_USER_AGENT: {{ . | quote }}
  {{- end }}
  {{- with $cfg.scrapeRequestTimeout }}
  SCRAPE_REQUEST_TIMEOUT: {{ . | quote }}
  {{- end }}
  {{- /* numeric knobs: 0 is a valid value, so test for "unset" instead of truthiness */}}
  {{- if include "greenmedical.isSet" $cfg.scrapeRetryTotal }}
  SCRAPE_RETRY_TOTAL: {{ $cfg.scrapeRetryTotal | toString | quote }}
  {{- end }}
  {{- if include "greenmedical.isSet" $cfg.scrapeBackoffFactor }}
  SCRAPE_BACKOFF_FACTOR: {{ $cfg.scrapeBackoffFactor | toString | quote }}
  {{- end }}
  {{- with $cfg.scrapePharmacyDelay }}
  SCRAPE_PHARMACY_DELAY: {{ . | quote }}
  {{- end }}
  {{- with $cfg.scrapePageDelay }}
  SCRAPE_PAGE_DELAY: {{ . | quote }}
  {{- end }}
  {{- if include "greenmedical.isSet" $cfg.scrapeMinSuccessRatio }}
  SCRAPE_MIN_SUCCESS_RATIO: {{ $cfg.scrapeMinSuccessRatio | toString | quote }}
  {{- end }}
  {{- range $key, $value := $cfg.extra }}
  {{ $key }}: {{ $value | toString | quote }}
  {{- end }}
